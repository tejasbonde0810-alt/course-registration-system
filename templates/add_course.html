<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add New Course</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #00000010;
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button, .back {
            display: inline-block;
            padding: 11px 15px;
            margin-top: 20px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Add New Course</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form action="{{ url_for('admin_add_course') }}" method="POST">

        <label for="course_name">Course Name</label>
        <input
            type="text"
            id="course_name"
            name="course_name"
            maxlength="200"
            required
        >

        <label for="department">Department</label>
        <input
            type="text"
            id="department"
            name="department"
            required
        >

        <label for="credits">Credits</label>
        <input
            type="number"
            id="credits"
            name="credits"
            min="1"
            required
        >

        <label for="capacity">Maximum Student Capacity</label>
        <input
            type="number"
            id="capacity"
            name="capacity"
            min="1"
            required
        >

        <button type="submit">Add Course</button>
    </form>

    <a class="back" href="{{ url_for('admin_dashboard') }}">
        Back to Admin Dashboard
    </a>
</div>

</body>
</html>
