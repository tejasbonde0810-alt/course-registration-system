<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #eef4ff,
                #dce8ff
            );

            display: flex;

            align-items: center;

            justify-content: center;

        }

        .login-container {

            width: 420px;

            background: white;

            padding: 45px;

            border-radius: 20px;

            box-shadow:
                0 20px 50px
                rgba(30, 60, 120, 0.18);

        }

        .logo {

            width: 65px;

            height: 65px;

            margin: auto;

            margin-bottom: 25px;

            background: linear-gradient(
                135deg,
                #173b8f,
                #2563c7
            );

            border-radius: 16px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 28px;

        }

        h1 {

            text-align: center;

            color: #172554;

            font-size: 28px;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #64748b;

            font-size: 14px;

            margin-bottom: 30px;

        }

        .form-group {

            margin-bottom: 20px;

        }

        label {

            display: block;

            color: #334155;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #d7deea;

            border-radius: 9px;

            background: #f8fafc;

            outline: none;

            font-size: 14px;

        }

        input:focus {

            border-color: #2563c7;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 199, 0.10);

        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 9px;

            background:
                linear-gradient(
                    90deg,
                    #173b8f,
                    #2563c7
                );

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;

        }

        button:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 18px
                rgba(37, 99, 199, 0.25);

        }

        .register-text {

            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #64748b;

        }

        .register-text a {

            color: #2563c7;

            font-weight: 600;

            text-decoration: none;

        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="logo">
            🎓
        </div>

        <h1>
            Welcome Back
        </h1>

        <p class="subtitle">
            Login to your student account
        </p>

        <form method="POST">

            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button type="submit">
                Login →
            </button>

        </form>


        <p class="register-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </p>

    </div>

</body>

</html>
